services:
  # Backend API & WebSocket Core
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-isp-os-backend
    restart: always
    environment:
      PORT: 4000
      CWMP_PORT: 7547
      CWMP_REQUIRE_AUTH: ${CWMP_REQUIRE_AUTH:-true}
      ACS_FIRMWARE_BASE_URL: ${ACS_FIRMWARE_BASE_URL:-http://acs.your-isp.net:7547}
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ai_isp_os_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-ai-isp-os}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      PAYMENT_SECRET_MASTER_KEY: ${PAYMENT_SECRET_MASTER_KEY:?PAYMENT_SECRET_MASTER_KEY is required}
      PAYMENT_SECRET_SALT: ${PAYMENT_SECRET_SALT:?PAYMENT_SECRET_SALT is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?WHATSAPP_WEBHOOK_SECRET is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
      DEMO_MODE: ${DEMO_MODE:-false}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:4000:4000"
      - "0.0.0.0:7547:7547"
    volumes:
      - firmware_data:/app/uploads/firmware
      - wa_session_data:/app/data
    depends_on:
      - mongodb
      - redis
      - evolution-api
    networks:
      - ai-isp-os-net

  # Frontend Web Applications (Vite / Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-isp-os-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - ai-isp-os-net

  # Multi-Tenant Document & Transactional Database (Internal Network Only)
  mongodb:
    image: mongo:7.0
    container_name: ai-isp-os-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-isp-os-net

  # Cache & Event Bus (Internal Network Only)
  redis:
    image: redis:7.2-alpine
    container_name: ai-isp-os-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-isp-os-net

  # Prometheus Telemetry & Metrics (Internal Network Only)
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: ai-isp-os-prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - ai-isp-os-net

  # WhatsApp Microservice Engine (Evolution API v2)
  # Provides rock-solid WhatsApp Web Multi-Device QR session handling & ₹0 OTP messaging
  evolution-api:
    image: evoapicloud/evolution-api:v2.2
    container_name: ai-isp-os-evolution
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/2
      - CACHE_REDIS_SAVE_INSTANCES=true
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - ai-isp-os-net

  # PostgreSQL for Evolution API Persistent Session Store
  postgres:
    image: postgres:15-alpine
    container_name: ai-isp-os-postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: evolution
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
    networks:
      - ai-isp-os-net

volumes:
  mongo_data:
  redis_data:
  firmware_data:
  wa_session_data:
  evolution_instances:
  postgres_evolution_data:

networks:
  ai-isp-os-net:
    driver: bridge
