# ==============================================================================
# Production Nginx Configuration for ISP Auto Configuration Server (ACS)
# ==============================================================================

# Upstream ACS Backend API & WebSocket
upstream acs_backend {
    server 127.0.0.1:4000;
    keepalive 64;
}

# Upstream Dedicated TR-069 CWMP Engine
upstream acs_cwmp {
    server 127.0.0.1:7547;
    keepalive 256;
}

# 1. TR-069 CWMP Dedicated Listener (Port 7547)
# Serves ONTs/routers directly across ISP WAN, PPPoE, or CGNAT networks
server {
    listen 7547;
    listen [::]:7547;
    server_name acs.your-isp.net;

    # Buffer & Timeout Optimizations for Large SOAP XML Informs
    client_max_body_size 25M;
    client_body_buffer_size 1M;
    client_body_timeout 60s;
    keepalive_timeout 65s;

    # Gzip disabled for SOAP XML to preserve TR-069 packet framing on older ONTs
    gzip off;

    location / {
        proxy_pass http://acs_cwmp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:$server_port;

        # Keep-alive connection pooling
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Firmware binary streaming with range support
    location /firmware/download/ {
        proxy_pass http://acs_cwmp/firmware/download/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

# 2. Operator Management UI & REST API (HTTP -> HTTPS Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name acs.your-isp.net admin.your-isp.net;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Secure HTTPS Operator Portal & Management API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acs.your-isp.net admin.your-isp.net;

    # SSL Certificates (Let's Encrypt or Commercial CA)
    ssl_certificate /etc/letsencrypt/live/acs.your-isp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acs.your-isp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Frontend Single Page Application
    location / {
        root /var/www/acs-frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend REST APIs
    location /api/ {
        proxy_pass http://acs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Real-time WebSocket Engine
    location /socket.io/ {
        proxy_pass http://acs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # System Health Endpoints
    location /health/ {
        proxy_pass http://acs_backend/health/;
        proxy_set_header Host $host;
    }
}
