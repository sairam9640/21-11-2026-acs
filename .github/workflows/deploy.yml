
name: Deploy ACS to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' '109.122.56.149 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPURAfaMc2FtkGCwnl0KrYKntXXGmNmRtuGTj5hHX5mg' >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" '
              set -eu
              cd /root/21-11-2026-acs

              git fetch origin main

              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo "ERROR: Local tracked changes detected. Deployment stopped."
                exit 1
              fi

              git merge --ff-only origin/main

              docker compose build backend frontend

              docker compose up -d --no-deps backend frontend

              docker compose ps
            '

